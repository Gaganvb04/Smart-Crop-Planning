<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Management - Smart Crop Planning</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>
    <nav class="navbar">
        <a href="/pages/dashboard.html" class="navbar-brand">
            <span class="logo-icon">🌾</span>
            <span data-i18n="app_name">Smart Crop Planning</span>
        </a>
        <div class="navbar-links">
            <a href="/pages/dashboard.html" data-i18n="dashboard">🏠 Dashboard</a>
            <a href="/pages/land.html" class="active" data-i18n="land">📍 Land</a>
            <a href="/pages/crop-search.html" data-i18n="crops">🌱 Crops</a>
            <a href="/pages/analytics.html" data-i18n="analytics">📊 Analytics</a>
            <button onclick="handleLogout()" data-i18n="logout">🚪 Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>📍 Land Management</h1>
            <p data-i18n="land_subtitle">Register and manage your land locations</p>
        </div>

        <div class="grid grid-2">
            <!-- Add Land Form -->
            <div class="card">
                <div class="card-header">
                    <h2>➕ Add New Land</h2>
                </div>
                <div id="land-alert"></div>

                <div class="form-group">
                    <label>🏘️ Village</label>
                    <div class="input-with-voice">
                        <input type="text" id="land-village" class="form-control" placeholder="Enter village name">
                        <button type="button" class="btn btn-icon btn-voice"
                            onclick="voiceInput('land-village')">🎤</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>🏛️ District</label>
                    <div class="input-with-voice">
                        <input type="text" id="land-district" class="form-control" placeholder="Enter district name">
                        <button type="button" class="btn btn-icon btn-voice"
                            onclick="voiceInput('land-district')">🎤</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>🗺️ State</label>
                    <select id="land-state" class="form-control">
                        <option value="">Select State</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📐 Land Area (Acres)</label>
                    <input type="number" id="land-area" class="form-control" placeholder="e.g. 2.5" step="0.1"
                        min="0.1">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>📍 Latitude</label>
                        <input type="number" id="land-lat" class="form-control" placeholder="e.g. 25.3176"
                            step="0.0001">
                    </div>
                    <div class="form-group">
                        <label>📍 Longitude</label>
                        <input type="number" id="land-lng" class="form-control" placeholder="e.g. 82.9739"
                            step="0.0001">
                    </div>
                </div>

                <div class="flex gap-1">
                    <button class="btn btn-outline" onclick="getCurrentLocation()">📍 Use My GPS</button>
                    <button class="btn btn-primary" style="flex:1" onclick="addLand()">✅ Save Land</button>
                </div>

                <!-- Map -->
                <div class="mt-2">
                    <h3 class="mb-1">📍 Mark on Map (Click to set location)</h3>
                    <div id="map" class="map-container"></div>
                </div>

                <!-- Crop Mapping Section -->
                <div class="mt-3" id="crop-mapping-section">
                    <h3 class="mb-1">🌾 Map Crop to Land</h3>
                    <div class="form-group">
                        <label>Select Land</label>
                        <select id="map-land-select" class="form-control">
                            <option value="">-- Choose a land --</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Season</label>
                            <select id="map-season" class="form-control">
                                <option value="Kharif">🌧️ Kharif (Jun-Oct)</option>
                                <option value="Rabi">❄️ Rabi (Oct-Mar)</option>
                                <option value="Zaid">☀️ Zaid (Mar-Jun)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Year</label>
                            <select id="map-year" class="form-control">
                                <option value="2025">2025</option>
                                <option value="2026" selected>2026</option>
                                <option value="2027">2027</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Select Crop</label>
                        <select id="map-crop-select" class="form-control">
                            <option value="">-- Choose a crop --</option>
                        </select>
                    </div>
                    <button class="btn btn-secondary" style="width:100%" onclick="mapCrop()">🌾 Map Crop to
                        Land</button>
                    <div id="crop-map-alert" class="mt-1"></div>
                </div>
            </div>

            <!-- My Lands List -->
            <div>
                <div class="card">
                    <div class="card-header">
                        <h2>📋 My Registered Lands</h2>
                    </div>
                    <div id="my-lands" class="card-body">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Loading...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/voice.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/map.js"></script>

    <script>
        let map, marker;

        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('language') || 'en';
            setLanguage(lang);
            initLandMap('map', (lat, lng) => {
                document.getElementById('land-lat').value = lat.toFixed(6);
                document.getElementById('land-lng').value = lng.toFixed(6);
            });
            loadMyLands();
            loadCropsForMapping();
        });

        async function addLand() {
            const alertDiv = document.getElementById('land-alert');
            const data = {
                village: document.getElementById('land-village').value.trim(),
                district: document.getElementById('land-district').value.trim(),
                state: document.getElementById('land-state').value,
                area_acres: document.getElementById('land-area').value,
                latitude: document.getElementById('land-lat').value || null,
                longitude: document.getElementById('land-lng').value || null
            };

            try {
                const res = await api.post('/api/lands', data);
                if (res.success) {
                    alertDiv.innerHTML = '<div class="alert alert-success">✅ Land added! ID: ' + res.land.land_uid + '</div>';
                    // Clear form
                    ['land-village', 'land-district', 'land-area', 'land-lat', 'land-lng'].forEach(id => document.getElementById(id).value = '');
                    document.getElementById('land-state').value = '';
                    loadMyLands();
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-error">❌ ${res.errors.join(', ')}</div>`;
                }
            } catch (e) {
                alertDiv.innerHTML = '<div class="alert alert-error">❌ Failed to add land</div>';
            }
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    document.getElementById('land-lat').value = lat.toFixed(6);
                    document.getElementById('land-lng').value = lng.toFixed(6);
                    setMapMarker(lat, lng);
                }, () => {
                    alert('Unable to get GPS. Please mark on map.');
                });
            } else {
                alert('GPS not supported on this device.');
            }
        }

        async function loadMyLands() {
            try {
                const res = await api.get('/api/lands');
                const container = document.getElementById('my-lands');
                const select = document.getElementById('map-land-select');

                if (res.success && res.lands.length > 0) {
                    container.innerHTML = res.lands.map(l => `
                        <div class="land-card mb-1">
                            <div class="flex-between">
                                <div>
                                    <span class="land-uid">${l.land_uid}</span>
                                    <h3>${l.village}, ${l.district}</h3>
                                    <p style="color:var(--text-light)">${l.state} • ${l.area_acres} acres</p>
                                    ${l.latitude ? `<p style="font-size:0.8rem;color:var(--text-light)">📍 ${parseFloat(l.latitude).toFixed(4)}, ${parseFloat(l.longitude).toFixed(4)}</p>` : ''}
                                </div>
                                <div>
                                    ${l.crop_mappings.map(cm => `<span class="badge badge-${cm.season.toLowerCase()}">${cm.crop_icon} ${cm.crop_name}</span>`).join(' ')}
                                    <br>
                                    <button class="btn btn-sm btn-danger mt-1" onclick="deleteLand(${l.id})">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    // Update land selector
                    select.innerHTML = '<option value="">-- Choose a land --</option>' +
                        res.lands.map(l => `<option value="${l.id}">${l.land_uid} - ${l.village} (${l.area_acres} acres)</option>`).join('');
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="icon">📍</div><h3>No lands yet</h3><p>Add your first land above</p></div>';
                }
            } catch (e) {
                console.error('Load lands error:', e);
            }
        }

        async function loadCropsForMapping() {
            try {
                const res = await api.get('/api/crops');
                const select = document.getElementById('map-crop-select');
                if (res.success) {
                    select.innerHTML = '<option value="">-- Choose a crop --</option>' +
                        res.crops.map(c => `<option value="${c.id}">${c.icon} ${c.name} (${c.season})</option>`).join('');
                }
            } catch (e) { }
        }

        async function mapCrop() {
            const alertDiv = document.getElementById('crop-map-alert');
            const data = {
                land_id: document.getElementById('map-land-select').value,
                crop_id: document.getElementById('map-crop-select').value,
                season: document.getElementById('map-season').value,
                year: document.getElementById('map-year').value
            };

            if (!data.land_id || !data.crop_id) {
                alertDiv.innerHTML = '<div class="alert alert-error">⚠️ Select both land and crop</div>';
                return;
            }

            try {
                const res = await api.post('/api/crop-mapping', data);
                if (res.success) {
                    alertDiv.innerHTML = '<div class="alert alert-success">✅ Crop mapped successfully!</div>';
                    loadMyLands();
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-error">❌ ${res.errors.join(', ')}</div>`;
                }
            } catch (e) {
                alertDiv.innerHTML = '<div class="alert alert-error">❌ Failed to map crop</div>';
            }
        }

        async function deleteLand(landId) {
            if (!confirm('Delete this land and all its crop mappings?')) return;
            try {
                await api.delete(`/api/lands/${landId}`);
                loadMyLands();
            } catch (e) { }
        }
    </script>
</body>

</html>
