<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Smart Crop Planning</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mobile.css">
</head>

<body>
    <nav class="navbar">
        <a href="/pages/dashboard.html" class="navbar-brand">
            <span class="logo-icon">🌾</span>
            <span data-i18n="app_name">Smart Crop Planning</span>
        </a>
        <div class="navbar-links">
            <a href="/pages/dashboard.html" data-i18n="dashboard">🏠 Dashboard</a>
            <a href="/pages/land.html" data-i18n="land">📍 Land</a>
            <a href="/pages/crop-search.html" data-i18n="crops">🌱 Crops</a>
            <a href="/pages/analytics.html" class="active" data-i18n="analytics">📊 Analytics</a>
            <button onclick="handleLogout()" data-i18n="logout">🚪 Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>📊 Market Analytics</h1>
            <p data-i18n="analytics_subtitle">Visual market trends and crop analysis</p>
        </div>

        <!-- Market Overview -->
        <div class="card">
            <div class="card-header">
                <h2>🚦 Market Opportunity Overview</h2>
                <button class="btn btn-sm btn-primary" onclick="speakOverview()">🔊 Listen</button>
            </div>
            <div class="grid grid-3" id="traffic-lights">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-2 mt-2">
            <div class="chart-container card">
                <h3 class="text-center mb-1">📊 Top Crops by Acres</h3>
                <canvas id="top-crops-chart"></canvas>
            </div>
            <div class="chart-container card">
                <h3 class="text-center mb-1">🥧 Season-wise Distribution</h3>
                <canvas id="overall-season-chart"></canvas>
            </div>
        </div>

        <!-- All Crops Table -->
        <div class="card mt-2">
            <div class="card-header">
                <h2>📋 Crops Summary</h2>
            </div>
            <div style="overflow-x: auto;">
                <table style="width:100%; border-collapse: collapse;" id="crops-table">
                    <thead>
                        <tr style="background: var(--primary-bg);">
                            <th style="padding:12px; text-align:left;">Crop</th>
                            <th style="padding:12px; text-align:left;">Season</th>
                            <th style="padding:12px; text-align:right;">Total Acres</th>
                            <th style="padding:12px; text-align:center;">Trend</th>
                            <th style="padding:12px; text-align:left;">Advice</th>
                        </tr>
                    </thead>
                    <tbody id="crops-tbody">
                        <tr>
                            <td colspan="5" class="text-center" style="padding:2rem;">
                                <div class="spinner" style="margin:auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- My Farm Analytics -->
        <div class="card mt-2">
            <div class="card-header">
                <h2>🌾 My Farm Analytics</h2>
            </div>
            <div class="grid grid-2">
                <div class="chart-container">
                    <h3 class="text-center mb-1">My Crop Distribution</h3>
                    <canvas id="my-crop-chart"></canvas>
                </div>
                <div id="my-farm-stats" class="flex-center" style="flex-direction:column; gap:1rem;">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/voice.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/charts.js"></script>
    <script src="/js/analytics.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('language') || 'en';
            setLanguage(lang);
            loadAnalytics();
        });

        async function loadAnalytics() {
            await Promise.all([loadCropsSummary(), loadFarmerAnalytics()]);
        }

        async function loadCropsSummary() {
            try {
                const res = await api.get('/api/analytics/summary');
                if (!res.success) return;

                const summary = res.summary;

                // Traffic lights
                const tlContainer = document.getElementById('traffic-lights');
                const groups = { high_supply: [], balanced: [], high_opportunity: [] };
                summary.forEach(s => {
                    if (s.total_acres > 0) {
                        groups[s.market_trend.level].push(s);
                    }
                });

                tlContainer.innerHTML = `
                    <div style="text-align:center;">
                        <div class="traffic-light" style="display:inline-flex;">
                            <div class="traffic-dot red ${groups.high_supply.length > 0 ? 'active' : ''}"></div>
                            <div class="traffic-dot yellow ${groups.balanced.length > 0 ? 'active' : ''}"></div>
                            <div class="traffic-dot green ${groups.high_opportunity.length > 0 ? 'active' : ''}"></div>
                        </div>
                    </div>
                    <div>
                        <h3 style="color:var(--red)">🔴 High Supply (${groups.high_supply.length})</h3>
                        ${groups.high_supply.map(s => `<p>${s.icon} ${s.name} - ${s.total_acres.toFixed(1)} acres</p>`).join('') || '<p style="color:var(--text-light)">None</p>'}
                        <h3 class="mt-1" style="color:var(--yellow)">🟡 Balanced (${groups.balanced.length})</h3>
                        ${groups.balanced.map(s => `<p>${s.icon} ${s.name} - ${s.total_acres.toFixed(1)} acres</p>`).join('') || '<p style="color:var(--text-light)">None</p>'}
                    </div>
                    <div>
                        <h3 style="color:var(--green)">🟢 High Opportunity (${groups.high_opportunity.length})</h3>
                        ${groups.high_opportunity.map(s => `<p>${s.icon} ${s.name} - ${s.total_acres.toFixed(1)} acres</p>`).join('') || '<p style="color:var(--text-light)">None</p>'}
                    </div>
                `;

                // Top Crops Bar Chart
                const active = summary.filter(s => s.total_acres > 0).sort((a, b) => b.total_acres - a.total_acres).slice(0, 10);
                renderBarChart('top-crops-chart',
                    active.map(s => `${s.icon} ${s.name}`),
                    active.map(s => s.total_acres),
                    'Acres'
                );

                // Season Pie
                const seasonTotals = { Kharif: 0, Rabi: 0, Zaid: 0 };
                summary.forEach(s => { seasonTotals[s.season] = (seasonTotals[s.season] || 0) + s.total_acres; });
                renderPieChart('overall-season-chart',
                    Object.keys(seasonTotals),
                    Object.values(seasonTotals)
                );

                // Table
                const tbody = document.getElementById('crops-tbody');
                tbody.innerHTML = summary.map(s => `
                    <tr style="border-bottom:1px solid var(--border);">
                        <td style="padding:10px;">${s.icon} ${s.name}</td>
                        <td style="padding:10px;"><span class="badge badge-${s.season.toLowerCase()}">${s.season}</span></td>
                        <td style="padding:10px; text-align:right; font-weight:600;">${s.total_acres.toFixed(1)}</td>
                        <td style="padding:10px; text-align:center; font-size:1.3rem;">${s.market_trend.icon}</td>
                        <td style="padding:10px; font-size:0.85rem; color:var(--text-light);">${s.total_acres > 0 ? s.market_trend.advice : '-'}</td>
                    </tr>
                `).join('');

            } catch (e) {
                console.error('Summary error:', e);
            }
        }

        async function loadFarmerAnalytics() {
            try {
                const res = await api.get('/api/analytics/farmer');
                if (!res.success) return;
                const a = res.analytics;

                document.getElementById('my-farm-stats').innerHTML = `
                    <div class="stat-card" style="width:100%">
                        <div class="stat-icon">🌍</div>
                        <div class="stat-value">${a.total_lands}</div>
                        <div class="stat-label">Total Lands</div>
                    </div>
                    <div class="stat-card" style="width:100%">
                        <div class="stat-icon">📐</div>
                        <div class="stat-value">${a.total_land_acres.toFixed(1)}</div>
                        <div class="stat-label">Total Acres</div>
                    </div>
                    <div class="stat-card" style="width:100%">
                        <div class="stat-icon">✅</div>
                        <div class="stat-value">${a.mapped_lands} / ${a.total_lands}</div>
                        <div class="stat-label">Lands with Crops</div>
                    </div>
                `;

                // My crop pie chart
                const dist = a.crop_distribution;
                if (Object.keys(dist).length > 0) {
                    renderPieChart('my-crop-chart', Object.keys(dist), Object.values(dist));
                }
            } catch (e) {
                console.error('Farmer analytics error:', e);
            }
        }

        function speakOverview() {
            speak('Here is the market overview. Green crops have high opportunity. Yellow crops are balanced. Red crops are in high supply. Check the charts for detailed analysis.');
        }
    </script>
</body>

</html>
